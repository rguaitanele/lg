stages:
  - build

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKERHUB_REPOSITORY: "lg_hsdn"

build-container:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind-rootless
      alias: docker
      command: ["--tls=false"]
  before_script:
    - |
      if [ -z "${CI_REGISTRY:-}" ] || [ -z "${CI_REGISTRY_IMAGE:-}" ]; then
        echo "ERRO: o Container Registry não está habilitado nesta instância do GitLab."
        exit 1
      fi
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
        echo "ERRO: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN não estão disponíveis."
        exit 1
      fi
      echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "master" ]; then
        VERSION="latest"
      else
        VERSION="dev"
      fi

      IMAGE="$CI_REGISTRY_IMAGE:$VERSION"
      docker build --pull \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="$CI_COMMIT_SHA" \
        --build-arg IMAGE_VERSION="$VERSION" \
        --tag "$IMAGE" .

      PHP_VERSION="$(docker run --rm "$IMAGE" php -r 'echo PHP_VERSION;')"
      if [ "$PHP_VERSION" != "8.4.27" ]; then
        echo "ERRO: versão inesperada do PHP: $PHP_VERSION (esperada: 8.4.27)."
        exit 1
      fi

      docker run --rm "$IMAGE" php -r \
        'exit(extension_loaded("gmp") ? 0 : 1);'

      docker run --rm "$IMAGE" sh -c \
        'find /var/www/html -type f -name "*.php" -print0 | xargs -0 -n1 php -l'

      CONTAINER_ID="$(docker run --detach "$IMAGE")"
      trap 'docker logs "$CONTAINER_ID" 2>&1 || true; docker rm --force "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
      HEALTH_STATUS="starting"
      for ATTEMPT in $(seq 1 12); do
        HEALTH_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID")"
        [ "$HEALTH_STATUS" = "healthy" ] && break
        [ "$HEALTH_STATUS" = "unhealthy" ] && break
        sleep 5
      done
      if [ "$HEALTH_STATUS" != "healthy" ]; then
        echo "ERRO: smoke test HTTP falhou; estado do container: $HEALTH_STATUS."
        exit 1
      fi
      docker rm --force "$CONTAINER_ID" >/dev/null
      trap - EXIT

      docker push "$IMAGE"

      DOCKERHUB_IMAGE="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY:$VERSION"
      docker tag "$IMAGE" "$DOCKERHUB_IMAGE"
      docker push "$DOCKERHUB_IMAGE"

      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"

        docker tag "$IMAGE" "$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY:latest"
        docker push "$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'
